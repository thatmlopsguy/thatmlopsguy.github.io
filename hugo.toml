[params.services]
subtitle = """
  Hands-on platform engineering, DevOps, and SRE consulting that helps engineering teams ship faster,
  run more reliable systems, and build infrastructure that scales with the organization.
  """

[[params.services.items]]
name = "Platform Engineering"
points = [
  "Design your platform strategy and architecture",
  "Build golden paths and self-service standards",
  "Deliver platform roadmaps and governance models",
  "GitOps workflows for the entire Kubernetes platform",
]

[[params.services.items]]
name = "Internal Developer Portals"
points = [
  "Build production-ready Backstage deployments from scratch",
  "Service catalogs, software templates, custom plugins, technical documentation",
  "Integrate with your CI/CD, Kubernetes, and cloud infrastructure",
  "Solutions for Day-0, Day-1, and Day-2 challenges",
]

[[params.services.items]]
name = "AI Agents & Infrastructure"
points = [
  "Custom AI agents tailored to your workflows",
  "SDLC automation and operational decision-making",
  "Integrate agent platforms with your Kubernetes and DevOps stack",
  "LLM and MCP gateway integration, kagent, and agent-to-agent orchestration",
]

[[params.services.items]]
name = "DevOps & Automation"
points = [
  "Build CI/CD pipelines that ship faster and safer",
  "GitHub Actions, Helm charts, Terraform modules, custom tooling",
  "Comprehensive testing, security scanning, secrets management",
  "Reduce manual work, catch issues early, deploy with confidence",
]

[[params.services.items]]
name = "Private & Public Cloud"
points = [
  "Deploy production Kubernetes on AWS, GCP, or Azure",
  "Multi-cloud and hybrid environments with Terraform/OpenTofu",
  "Network security, compliance controls, disaster recovery",
  "Fully documented with monitoring, logging, backups, and runbooks",
]

[[params.services.items]]
name = "Site Reliability Engineering (SRE)"
points = [
  "Define SLIs/SLOs, build incident response, establish on-call rotations",
  "Deploy observability stacks with actionable dashboards and alerts",
  "Reduce MTTR through automation and capacity planning",
  "Measurable improvements in uptime and incident resolution",
]

