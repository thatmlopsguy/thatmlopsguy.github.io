<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-bottom">
            <p>&copy; {{ now.Year }} {{ .Site.Copyright | default .Site.Title }}. All rights reserved.</p>
            <div class="footer-links-inline">
                {{ with .Site.Params.sourceCodeUrl }}<a href="{{ . }}" rel="noopener" target="_blank">Source Code</a>{{ end }}
                {{ if ne .Site.Params.rss false }}
                <a href="{{ "index.xml" | absURL }}" class="rss-link" rel="alternate" type="application/rss+xml" title="RSS Feed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rss-icon"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
                    <span>RSS Feed</span>
                </a>
                {{ end }}
            </div>
        </div>
    </div>
</footer>
