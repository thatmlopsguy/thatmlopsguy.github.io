<header class="site-header">
    <nav class="nav-container">
        <a href="{{ "/" | relURL }}" class="nav-logo">{{ .Site.Title }}</a>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="nav-menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-menu" id="nav-menu">
            {{ range .Site.Menus.main }}
            <li><a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active" {{ end }}>{{ .Name }}</a>
            </li>
            {{ end }}
        </ul>
    </nav>
</header>
