<header class="site-header">
  <div class="container">
    <a href="{{ .Site.BaseURL }}" class="site-logo">{{ .Site.Title }}</a>
    <nav class="site-nav">
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active" {{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    {{ with .Site.Params.header_cta }}
    <a href="{{ .url }}" class="btn btn-sm btn-outline">{{ .text }}</a>
    {{ end }}
  </div>
</header>
